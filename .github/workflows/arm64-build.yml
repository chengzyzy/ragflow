name: ARM64 native build
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      publish:
        required: true
        type: boolean

# Only maintenance-branch publishing receives packages:write from the caller.
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      PUBLISH: ${{ inputs.publish && github.event_name != 'pull_request' && github.ref == 'refs/heads/arm64-native' && github.repository == 'chengzyzy/ragflow' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select image and source version
        id: config
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          case "$COMPONENT" in
            ragflow) context=.; file=Dockerfile; package=ghcr.io/chengzyzy/ragflow ;;
            mineru) context=docker/mineru-arm64; file=docker/mineru-arm64/Dockerfile; package=ghcr.io/chengzyzy/ragflow-mineru ;;
            *) echo 'Unknown image component' >&2; exit 1 ;;
          esac
          version=$(git describe --tags --match='v*' --always)
          tag="sha-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'context=%s\nfile=%s\nimage=%s:%s\nversion=%s\ncache=%s-buildcache:arm64\n' \
            "$context" "$file" "$package" "$tag" "$version" "$package" >> "$GITHUB_OUTPUT"
      - name: Reserve disk space on the GitHub runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.file }}
          platforms: linux/arm64
          load: true
          provenance: false
          tags: ${{ steps.config.outputs.image }}
          build-args: RAGFLOW_VERSION=${{ steps.config.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/chengzyzy/ragflow
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.config.outputs.version }}
          cache-from: type=registry,ref=${{ steps.config.outputs.cache }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0},mode=max,ignore-error=true', steps.config.outputs.cache) || '' }}
      - name: Check native image before pushing
        env:
          COMPONENT: ${{ inputs.component }}
          IMAGE: ${{ steps.config.outputs.image }}
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx prune --all --force
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = arm64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$GITHUB_SHA"
          if [[ "$COMPONENT" == ragflow ]]; then
            docker run --rm --network none --entrypoint python3 --env "EXPECTED_VERSION=$VERSION" \
              --mount "type=bind,src=${GITHUB_WORKSPACE}/tools/arm64/image_smoke.py,dst=/tmp/smoke.py,readonly" \
              "$IMAGE" /tmp/smoke.py
          else
            docker run --rm --network none --entrypoint python3 "$IMAGE" -c \
              'import importlib.metadata, torch, onnxruntime, six; print("MinerU", importlib.metadata.version("mineru"))'
            docker run --rm --network none --entrypoint mineru-api "$IMAGE" --help
          fi
      - name: Start services and check health
        env:
          COMPONENT: ${{ inputs.component }}
          IMAGE: ${{ steps.config.outputs.image }}
        run: bash tools/arm64/service_smoke.sh "$COMPONENT" "$IMAGE"
      - name: Preserve service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-${{ inputs.component }}-service-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm64-service-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Push the checked image to GHCR
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.config.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Image: `%s`\n\nPull by digest: `%s@%s`\n' "$IMAGE" "${IMAGE%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
