name: ARM64 native build
on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean

# Only maintenance-branch publishing receives packages:write from the caller.
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      PUBLISH: ${{ inputs.publish && github.event_name != 'pull_request' && github.ref == 'refs/heads/arm64-native' && github.repository == 'chengzyzy/ragflow' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select image and source version
        id: config
        run: |
          image_package=ghcr.io/chengzyzy/ragflow
          # Forks do not necessarily contain the upstream release tags.
          git fetch --no-tags --filter=blob:none https://github.com/infiniflow/ragflow.git 'refs/tags/v*:refs/tags/v*'
          version=$(git describe --tags --match='v*' --exclude='*-*')
          tag="sha-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'image=%s:%s\nversion=%s\ncache=%s-buildcache:arm64\n' \
            "$image_package" "$tag" "$version" "$image_package" >> "$GITHUB_OUTPUT"
      - name: Reserve disk space on the GitHub runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          tags: ${{ steps.config.outputs.image }}
          build-args: RAGFLOW_VERSION=${{ steps.config.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/chengzyzy/ragflow
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.config.outputs.version }}
          cache-from: type=registry,ref=${{ steps.config.outputs.cache }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0},mode=max,ignore-error=true', steps.config.outputs.cache) || '' }}
      - name: Check native image before pushing
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx prune --all --force
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = arm64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$GITHUB_SHA"
          docker run --rm --network none --entrypoint python3 --env "EXPECTED_VERSION=$VERSION" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/tools/arm64/image_smoke.py,dst=/tmp/smoke.py,readonly" \
            "$IMAGE" /tmp/smoke.py
      - name: Start services and check health
        env:
          IMAGE: ${{ steps.config.outputs.image }}
        run: bash tools/arm64/service_smoke.sh "$IMAGE"
      - name: Preserve service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-ragflow-service-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm64-service-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Push the checked image to GHCR
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.config.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Image: `%s`\n\nPull by digest: `%s@%s`\n' "$IMAGE" "${IMAGE%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
